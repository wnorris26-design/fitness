<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workout Pal</title>
  <meta name="description" content="Lift log, workout plan with exercise swaps, incline cardio and food tracking.">
  <meta name="theme-color" content="#173a2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout Pal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" class="wrap"></main>

  <div id="rest" class="rest" hidden>
    <div class="rest-bar"><i></i></div>
    <div class="rest-in">
      <span class="eyebrow">Rest</span>
      <span class="rest-time mono">0:00</span>
      <button class="btn small" data-act="rest-add">+30s</button>
      <button class="btn small ghost" data-act="rest-skip">Done</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="sheet"></div>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h3v4H3zM18 10h3v4h-3zM6 7h3v10H6zM15 7h3v10h-3zM9 11h6v2H9z"/></svg><span>Today</span></button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Plan</span></button>
    <button data-tab="food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M16 21V3c2.5 1 4 4 4 8h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Food</span></button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l6-6 4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Progress</span></button>
    <button data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>You</span></button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
